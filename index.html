<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gabby">
<meta name="robots" content="noindex,nofollow">
<title>Gabby</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("lifeos.theme")||"forest"}catch(e){document.documentElement.dataset.theme="forest"}</script>
</head>
<body>
<div id="bg"><div class="forest" id="forest"></div><canvas id="flies"></canvas><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="gate" class="hidden"></div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><div class="logo"></div>Gabby</div>
    <div class="side-ring" id="sring"></div>
    <nav class="nav" id="snav"></nav>
    <div class="foot">
      <button class="sync" id="syncs" data-act="sync"><span class="dot"></span><span class="lbl">Saved</span></button>
      <button class="btn sm" data-act="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock</button>
    </div>
  </aside>
  <header id="mtop">
    <div class="brand"><div class="logo"></div>Gabby</div>
    <div class="row">
      <button class="sync" id="syncm" data-act="sync"><span class="dot"></span><span class="lbl">Saved</span></button>
      <button class="btn icon" data-act="lock" aria-label="Lock"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
  <nav id="bnav" class="glass"></nav>
</div>

<div id="modal"><div class="box glass" id="mbox"></div></div>
<div id="toasts"></div>
<canvas id="fx"></canvas>

<script src="app.js"></script>
<script src="meals.js"></script>
</body>
</html>
